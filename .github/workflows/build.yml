name: Build FreeTemplates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Android32
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android32

      - uses: actions/upload-artifact@v4
        with:
          name: FreeTemplates-Android32
          path: ${{ steps.build.outputs.build-output }}/*.geode
